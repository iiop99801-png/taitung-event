<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東開店人生 - 聚會報名系統</title>
    
    <!-- Firebase 核心 SDK (相容模式) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

    <style>
        :root {
            --taitung-blue: #005CAF; 
            --vintage-green: #2b5f3a; 
            --danger-red: #d9534f;
            --warning-orange: #f0ad4e;
            --bg-light: #f5f5f5;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', '微軟正黑體', sans-serif;
            background: repeating-linear-gradient(45deg, #ffffff, #ffffff 15px, #eef5f0 15px, #eef5f0 30px);
            margin: 0; padding: 15px; color: #333;
            display: flex; justify-content: center;
        }

        .app-container {
            width: 100%; max-width: 600px; background: white;
            border: 2px solid var(--vintage-green); border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); overflow: hidden;
            min-height: 85vh; position: relative;
        }

        .header {
            background-color: var(--vintage-green); color: white;
            padding: 15px; text-align: center; font-size: 20px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .header-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            padding: 5px 10px; border-radius: 5px; cursor: pointer;
        }

        .nav-tabs { display: flex; background: #eee; border-bottom: 2px solid var(--vintage-green); }
        .nav-tabs button {
            flex: 1; padding: 12px; border: none; background: none;
            font-size: 14px; font-weight: bold; cursor: pointer; color: #666;
        }
        .nav-tabs button.active { background: white; color: var(--taitung-blue); border-bottom: 4px solid var(--taitung-blue); }

        .content { padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--vintage-green); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .form-group textarea { resize: vertical; }

        .btn {
            display: block; width: 100%; padding: 12px;
            background-color: var(--taitung-blue); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px; text-align: center; box-sizing: border-box;
        }
        .btn-outline { background: white; color: var(--vintage-green); border: 2px solid var(--vintage-green); }
        .btn-danger { background: var(--danger-red); color: white; }
        .btn-warning { background: var(--warning-orange); color: white; }
        .btn-sm { padding: 6px 10px; font-size: 13px; width: auto; display: inline-block; margin-top: 0; }
        
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #fafafa; }
        .card h3 { margin: 0 0 10px 0; color: var(--taitung-blue); font-size: 20px; }
        .card p { margin: 5px 0; line-height: 1.5; }
        .summary-box { background: #eef5f0; padding: 15px; border-radius: 8px; border-left: 5px solid var(--taitung-blue); margin-bottom: 15px; }
        
        .price-rules-box {
            background: #fff8e7; border: 1px solid #f0ad4e; border-left: 5px solid #f0ad4e;
            padding: 12px 15px; border-radius: 8px; margin: 15px 0;
        }
        .price-rules-box h4 { margin: 0 0 8px 0; color: #b7791f; font-size: 16px; }
        .price-rules-box ul { margin: 0; padding-left: 20px; color: #444; line-height: 1.6; }

        .order-badge {
            display: inline-block; background: #eee; color: #555; padding: 3px 8px;
            border-radius: 4px; font-size: 12px; font-family: monospace; font-weight: bold;
        }

        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .bg-pending { background: #f0ad4e; }
        .bg-unpaid { background: var(--danger-red); }
        .bg-success { background: var(--vintage-green); }
        .bg-refunding { background: #e67e22; }
        .bg-refunded { background: #7f8c8d; }

        .ticket { border: 3px dashed var(--vintage-green); padding: 20px; text-align: center; background: white; margin-bottom: 20px; position: relative; }
        .ticket-name { color: var(--taitung-blue); font-size: 26px; font-weight: bold; margin: 10px 0; }
        .ticket-stamp { margin-top: 15px; display: inline-block; border: 3px solid #d9534f; color: #d9534f; padding: 8px 16px; font-size: 20px; font-weight: bold; transform: rotate(-5deg); border-radius: 8px; }
        
        .proof-img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ccc; }
        .poster-preview { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; display: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .countdown-text { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        
        .timeline { display: flex; justify-content: space-between; position: relative; margin: 20px 0; text-align: center; font-size: 12px; font-weight: bold; color: #ccc; }
        .timeline::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #ddd; z-index: 1; }
        .timeline-step { position: relative; z-index: 2; flex: 1; }
        .timeline-icon { width: 26px; height: 26px; border-radius: 50%; background: #ddd; margin: 0 auto 5px; line-height: 26px; color: white; font-size: 13px; }
        .timeline-step.active .timeline-icon { background: var(--taitung-blue); box-shadow: 0 0 0 3px rgba(0,92,175,0.2); }
        .timeline-step.active { color: var(--taitung-blue); }
        .timeline-step.done .timeline-icon { background: var(--vintage-green); }
        .timeline-step.done { color: var(--vintage-green); }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; color: var(--taitung-blue);
        }
    </style>
</head>
<body>

<div id="loading-overlay">雲端連線中...</div>

<div class="app-container">
    <div class="header">
        <span id="header-title">系統登入</span>
        <button id="logout-btn" class="header-btn" style="display:none;" onclick="logout()">登出</button>
    </div>

    <!-- ================= 登入網關 ================= -->
    <div id="sys-gateway" class="view active">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('sys-gateway', 'login-member', this)">會員登入</button>
            <button class="tab-btn" onclick="switchTab('sys-gateway', 'login-admin', this)">管理員登入</button>
        </div>
        <div class="content">
            <div id="login-member" class="sub-view active">
                <div class="form-group"><label>手機號碼 (必填)</label><input type="tel" id="member-phone" placeholder="請輸入手機號碼"></div>
                <div class="form-group"><label>邀請碼 (首次登入必填)</label><input type="text" id="member-code" placeholder="首次登入請填寫"></div>
                <button class="btn" onclick="handleMemberLogin()">登入系統</button>
            </div>
            
            <div id="login-admin" class="sub-view" style="display:none;">
                <div class="form-group"><label>管理員帳號</label><input type="text" id="admin-user" placeholder="請輸入帳號"></div>
                <div class="form-group"><label>密碼</label><input type="password" id="admin-pwd" placeholder="請輸入密碼"></div>
                <button class="btn btn-danger" onclick="handleAdminLogin()">登入後台</button>
            </div>
        </div>
    </div>

    <!-- ================= 一般會員前台 ================= -->
    <div id="sys-member" class="view">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('sys-member', 'mem-events', this); renderEventInfo();">活動報名</button>
            <button class="tab-btn" onclick="switchTab('sys-member', 'mem-myrecords', this); renderMyRecord();">我的報名</button>
        </div>
        <div class="content">
            <div id="mem-events" class="sub-view active">
                <div class="card" style="padding-top: 10px;">
                    <img id="display-event-poster" class="poster-preview" src="">
                    <h3 id="display-event-title">載入中...</h3>
                    
                    <div class="summary-box" style="margin-top: 15px; border-left-color: var(--danger-red);">
                        <p style="margin: 0; font-weight: bold; color: var(--danger-red);">⏳ 報名截止倒數 (截止前可100%全額退款)：</p>
                        <div id="countdown-deadline" class="countdown-text" style="color:var(--danger-red);">計算中...</div>
                    </div>
                    <div class="summary-box" style="margin-top: 15px; border-left-color: var(--vintage-green);">
                        <p style="margin: 0; font-weight: bold; color: var(--vintage-green);">🎊 距離活動開始還有：</p>
                        <div id="countdown-event" class="countdown-text" style="color:var(--vintage-green);">計算中...</div>
                    </div>

                    <p id="display-event-datetime" style="font-weight:bold; color:var(--vintage-green);">📅 活動時間：</p>
                    <p id="display-event-deadline-text" style="color:var(--danger-red); font-weight:bold;">⏳ 報名截止：</p>
                    <p id="display-event-location">📍 地點：</p>
                    <p id="display-event-desc" style="white-space: pre-wrap; color: #555; background: #fff; padding: 10px; border-radius: 6px; border: 1px dashed #ccc;"></p>
                    
                    <!-- 收費規則區塊 -->
                    <div class="price-rules-box">
                        <h4>💰 活動收費標準與規則</h4>
                        <ul id="display-event-price-rules"></ul>
                        <p style="margin:8px 0 0 0; font-size:13px; color:#c0392b; font-weight:bold;">🛡️ 退款政策：報名截止時間前均可申請 100% 原路全額退款；截止後恕不受理退款。</p>
                    </div>
                    
                    <button id="btn-show-form" class="btn" onclick="document.getElementById('mem-form-area').style.display='block'">我要填寫報名表</button>
                </div>
                
                <div id="mem-form-area" style="display:none; border-top: 2px dashed #ccc; margin-top: 20px; padding-top: 20px;">
                    <div class="form-group"><label id="label-tier1">滿13歲以上</label><input type="number" id="qty-tier1" value="0" min="0" oninput="calcTotal()"></div>
                    <div class="form-group"><label id="label-tier2">滿6歲~13歲</label><input type="number" id="qty-tier2" value="0" min="0" oninput="calcTotal()"></div>
                    <div class="form-group"><label id="label-tier3" style="color:var(--danger-red);">未滿6歲 (免費)</label><input type="number" id="qty-tier3" value="0" min="0" oninput="calcTotal()"></div>
                    <div class="summary-box">總費用：NT$ <strong id="calc-total-amt" style="font-size:20px; color:var(--taitung-blue)">0</strong></div>
                    <button class="btn" onclick="submitRegistration()">確認報名送出</button>
                </div>
            </div>

            <div id="mem-myrecords" class="sub-view" style="display:none;">
                <div id="my-record-container"></div>
            </div>
        </div>
    </div>

    <!-- ================= 管理員後台 ================= -->
    <div id="sys-admin" class="view">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('sys-admin', 'admin-event', this)">發佈活動</button>
            <button class="tab-btn" onclick="switchTab('sys-admin', 'admin-approve', this); renderAdminApprovals();">名單與退款審核</button>
            <button class="tab-btn" onclick="switchTab('sys-admin', 'admin-members', this); renderAdminMemberList();">會員管理</button>
        </div>
        <div class="content">
            <div id="admin-event" class="sub-view active">
                <div class="summary-box" style="font-size: 14px;">點擊「發佈並同步活動圖文」，資料將直接寫入 Firebase 並即時同步所有裝置。</div>
                <div class="form-group">
                    <label>上傳活動海報圖片</label>
                    <input type="file" id="set-evt-poster" accept="image/*" onchange="previewAdminPoster(this)">
                    <img id="admin-poster-preview" class="proof-img-preview" style="max-height:150px;">
                </div>
                <div class="form-group"><label>活動名稱</label><input type="text" id="set-evt-title"></div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;"><label>活動舉辦時間</label><input type="datetime-local" id="set-evt-datetime"></div>
                    <div class="form-group" style="flex:1;"><label>報名截止時間 (可退款期限)</label><input type="datetime-local" id="set-evt-deadline"></div>
                </div>
                <div class="form-group"><label>活動地點</label><input type="text" id="set-evt-location"></div>
                <div class="form-group"><label>補充文字欄 (活動細節與說明)</label><textarea id="set-evt-desc" rows="3"></textarea></div>
                
                <!-- 自訂年齡區間與收費設定 -->
                <div style="background:#f9f9f9; padding:12px; border-radius:8px; border:1px solid #ddd; margin-bottom:15px;">
                    <label style="color:var(--taitung-blue); font-weight:bold; margin-bottom:8px; display:block;">⚙️ 年齡區間段與收費設定 (皆可自訂)</label>
                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                        <input type="text" id="set-tier1-name" placeholder="第1區間名稱 (例如: 滿13歲以上)" style="flex:2;">
                        <input type="number" id="set-tier1-price" placeholder="費用" style="flex:1;">
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                        <input type="text" id="set-tier2-name" placeholder="第2區間名稱 (例如: 滿6歲~13歲)" style="flex:2;">
                        <input type="number" id="set-tier2-price" placeholder="費用" style="flex:1;">
                    </div>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="set-tier3-name" placeholder="第3區間名稱 (例如: 未滿6歲)" style="flex:2;">
                        <input type="number" id="set-tier3-price" placeholder="費用 (免費填0)" style="flex:1;">
                    </div>
                </div>

                <div class="form-group"><label>額外收費規則補充說明 (選填)</label><input type="text" id="set-evt-rule-note" placeholder="例如：酒水自備，攜帶外食酌收清潔費"></div>
                <div class="form-group"><label>收款銀行與帳號</label><input type="text" id="set-evt-bank"></div>
                <button class="btn" onclick="publishEvent()">發佈並同步活動圖文</button>
            </div>

            <div id="admin-approve" class="sub-view" style="display:none;">
                <div id="admin-approval-list"></div>
            </div>

            <div id="admin-members" class="sub-view" style="display:none;">
                <div id="member-list-container"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. Firebase 初始化
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyAxeysTsUQ_CS_MoX58oX6QSLiNxWdXzXg",
        authDomain: "taitung-event.firebaseapp.com",
        projectId: "taitung-event",
        storageBucket: "taitung-event.firebasestorage.app",
        messagingSenderId: "72363629252",
        appId: "1:72363629252:web:8e00439387ce57fce9c791",
        measurementId: "G-2TDPTW8YB4"
    };

    firebase.initializeApp(firebaseConfig);
    firebase.analytics();
    const db = firebase.firestore();

    let currentPhone = "";
    let currentShopName = "";
    let currentEvent = {};
    let countdownTimer = null;
    let myRegistrationsUnsubscribe = null;
    let myLocalHistory = [];
    let adminRegistrationsUnsubscribe = null;
    let adminMembersUnsubscribe = null;
    let adminAllRegistrations = [];
    let adminMembersData = [];

    function showLoading(show) {
        document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }

    function formatTimeDisplay(isoString) {
        if(!isoString) return "未設定";
        return String(isoString).replace("T", " ");
    }

    function getCurrentTimeStr() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function generateOrderNo() {
        const now = new Date();
        const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const randomHex = Math.random().toString(16).substring(2, 6).toUpperCase();
        return `TT-${dateStr}-${randomHex}`;
    }

    function isBeforeDeadline() {
        if (!currentEvent.deadline) return true;
        const dlTime = new Date(currentEvent.deadline).getTime();
        const now = new Date().getTime();
        return now < dlTime;
    }

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 480;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height = height * (MAX_WIDTH / width);
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.5));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function switchMainView(viewId, title) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('header-title').innerText = title;
        document.getElementById('logout-btn').style.display = 'block';
    }

    function switchTab(parentId, targetId, btnEl) {
        document.querySelectorAll(`#${parentId} .sub-view`).forEach(el => el.style.display = 'none');
        document.querySelectorAll(`#${parentId} .tab-btn`).forEach(el => el.classList.remove('active'));
        document.getElementById(targetId).style.display = 'block';
        btnEl.classList.add('active');
    }

    function logout() { 
        if(countdownTimer) clearInterval(countdownTimer);
        if(myRegistrationsUnsubscribe) myRegistrationsUnsubscribe();
        if(adminRegistrationsUnsubscribe) adminRegistrationsUnsubscribe();
        if(adminMembersUnsubscribe) adminMembersUnsubscribe();
        currentPhone = ""; 
        location.reload(); 
    }

    // ==========================================
    // 2. 登入邏輯
    // ==========================================
    async function handleMemberLogin() {
        const phone = document.getElementById('member-phone').value.trim();
        const code = document.getElementById('member-code').value.trim();
        if(!phone) return alert("請輸入手機號碼！");

        showLoading(true);
        try {
            const memberDoc = await db.collection("members").doc(phone).get();
            if (memberDoc.exists) {
                currentPhone = phone;
                currentShopName = memberDoc.data().shopName || "會員店家";
            } else {
                if (!code) {
                    showLoading(false);
                    return alert("首次登入請務必輸入「聚會邀請碼」！");
                }
                const inputShopName = prompt("首次登入請設定您的「商家名稱」：");
                if (!inputShopName) {
                    showLoading(false);
                    return alert("必須設定商家名稱！");
                }
                await db.collection("members").doc(phone).set({
                    phone: phone,
                    code: code,
                    shopName: inputShopName,
                    role: "一般會員",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                currentPhone = phone;
                currentShopName = inputShopName;
            }

            switchMainView('sys-member', '前台 - ' + currentShopName);
            listenToCurrentEvent();
            listenToMyRegistrations();
        } catch (error) {
            alert("登入連線失敗：" + error.message);
        }
        showLoading(false);
    }

    function handleAdminLogin() {
        const user = document.getElementById('admin-user').value.trim();
        const pwd = document.getElementById('admin-pwd').value.trim();

        if (user === "1234567" && pwd === "7654321") {
            switchMainView('sys-admin', '管理員專區');
            loadAdminPanel();
        } else {
            alert("❌ 帳號或密碼錯誤！");
        }
    }

    // ==========================================
    // 3. 活動資訊與即時監聽
    // ==========================================
    function listenToCurrentEvent() {
        db.collection("config").doc("currentEvent").onSnapshot(doc => {
            if (doc.exists) {
                currentEvent = doc.data();
            } else {
                currentEvent = {
                    title: "開店人生第一場烤肉趴",
                    eventDateTime: "2026-09-30T18:00",
                    deadline: "2026-09-30T22:00",
                    location: "早午餐",
                    desc: "！可帶非群組朋友但一定要確實報名\n！酒水自備",
                    tier1Name: "滿13歲以上",
                    tier1Price: 600,
                    tier2Name: "滿6歲~13歲",
                    tier2Price: 300,
                    tier3Name: "未滿6歲",
                    tier3Price: 0,
                    ruleNote: "未滿6歲免費入場",
                    bank: "台東測試帳號",
                    posterImg: ""
                };
            }
            renderEventInfo();
        });
    }

    function startCountdowns() {
        if(countdownTimer) clearInterval(countdownTimer);
        function update() {
            const now = new Date().getTime();
            if(currentEvent.deadline) {
                const dlTime = new Date(currentEvent.deadline).getTime();
                const diffDl = dlTime - now;
                if(diffDl > 0) {
                    const d = Math.floor(diffDl / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diffDl % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diffDl % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diffDl % (1000 * 60)) / 1000);
                    document.getElementById('countdown-deadline').innerText = `${d}天 ${h}時 ${m}分 ${s}秒`;
                    document.getElementById('btn-show-form').style.display = 'block';
                } else {
                    document.getElementById('countdown-deadline').innerText = "已截止 (已停止退款申請)";
                    document.getElementById('btn-show-form').style.display = 'none';
                    document.getElementById('mem-form-area').style.display = 'none';
                }
            }
            if(currentEvent.eventDateTime) {
                const evtTime = new Date(currentEvent.eventDateTime).getTime();
                const diffEvt = evtTime - now;
                if(diffEvt > 0) {
                    const d = Math.floor(diffEvt / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diffEvt % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diffEvt % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diffEvt % (1000 * 60)) / 1000);
                    document.getElementById('countdown-event').innerText = `${d}天 ${h}時 ${m}分 ${s}秒`;
                } else {
                    document.getElementById('countdown-event').innerText = "活動已開始或已結束";
                }
            }
        }
        update();
        countdownTimer = setInterval(update, 1000);
    }

    function calcTotal() {
        const t1Price = Number(currentEvent.tier1Price || 0);
        const t2Price = Number(currentEvent.tier2Price || 0);
        const t3Price = Number(currentEvent.tier3Price || 0);

        const q1 = parseInt(document.getElementById('qty-tier1').value) || 0;
        const q2 = parseInt(document.getElementById('qty-tier2').value) || 0;
        const q3 = parseInt(document.getElementById('qty-tier3').value) || 0;

        const total = (q1 * t1Price) + (q2 * t2Price) + (q3 * t3Price);
        document.getElementById('calc-total-amt').innerText = total;

        const t1Name = currentEvent.tier1Name || "滿13歲以上";
        const t2Name = currentEvent.tier2Name || "滿6歲~13歲";
        const t3Name = currentEvent.tier3Name || "未滿6歲";

        return { 
            total, 
            pax: `${t1Name} ${q1}位, ${t2Name} ${q2}位, ${t3Name} ${q3}位` 
        };
    }

        const pendingList = adminAllRegistrations.filter(r => r.status === 'pending');
        const approvedList = adminAllRegistrations.filter(r => r.status === 'approved');
        const refundedList = adminAllRegistrations.filter(r => r.status === 'refunded');

        let html = "";

        // 1. 待處理退款專區 (最高優先順序)
        html += `<h4 style="margin-top:0; color:#d35400;">🔄 待處理原路退款名單 (${refundingList.length})</h4>`;
        if (refundingList.length === 0) {
            html += "<p style='color:#888;'>目前沒有待退款的申請。</p>";
        } else {
            refundingList.forEach(reg => {
                let orderBadge = reg.orderNo ? `<span class="order-badge">訂單：${reg.orderNo}</span>` : `<span class="order-badge">編號：${reg.id}</span>`;
                html += `
                    <div class="card" style="border-left: 5px solid var(--warning-orange); background:#fffdfa;">
                        <div style="margin-bottom:6px;">${orderBadge} <span class="status-badge bg-refunding">退款申請中</span></div>
                        <h3>${reg.shopName || "店家"} (${reg.phone})</h3>
                        <p style="color:#c0392b; font-size:16px; font-weight:bold;">應退款金額：NT$ ${reg.amt} (100%全額退)</p>
                        <div style="background:#fff; padding:10px; border-radius:6px; border:1px dashed #f0ad4e; line-height:1.6;">
                            <strong style="color:var(--taitung-blue);">原路退回帳戶資訊：</strong><br>
                            🏦 銀行代號/名稱：${reg.refundBankCode || "未填"}<br>
                            💳 匯款帳號：<strong style="color:var(--danger-red); font-size:16px;">${reg.refundAccount || "未填"}</strong><br>
                            👤 戶名：${reg.refundName || "未填"}
                        </div>
                        <button class="btn btn-warning" style="margin-top:12px;" onclick="confirmRefundComplete('${reg.id}')">
                            ✓ 確認款項已退回 (完成退款核銷)
                        </button>
                    </div>
                `;
            });
        }

        html += `<hr style="margin:25px 0; border:none; border-top:1px dashed #ccc;">`;

        // 2. 待審核付款專區
        html += `<h4 style="color:var(--taitung-blue);">⏳ 待審核付款名單 (${pendingList.length})</h4>`;
        if(pendingList.length === 0) {
            html += "<p style='color:#888;'>目前沒有待審核的名單。</p>";
        } else {
            pendingList.forEach(reg => {
                let displayImg = reg.proofImg ? `<img src="${reg.proofImg}" style="max-width:100%; border-radius:8px; margin: 10px 0; border: 1px solid #ccc;">` : "";
                let orderBadge = reg.orderNo ? `<span class="order-badge">訂單編號：${reg.orderNo}</span>` : `<span class="order-badge">編號：${reg.id}</span>`;

                html += `
                    <div class="card" style="border-left: 5px solid #f0ad4e;">
                        <div style="margin-bottom:6px;">${orderBadge}</div>
                        <h3>${reg.shopName || "店家"} (${reg.phone})</h3>
                        <p style="color:#666; font-size:14px;">送單時間：${formatTimeDisplay(reg.regTime)}</p>
                        <p>報名活動：${reg.eventTitle}</p>
                        <p>名額明細：${reg.pax}</p>
                        <p>應收總額：<strong style="color:var(--taitung-blue);">NT$ ${reg.amt}</strong></p>
                        <div style="background: #fff; padding: 10px; border-radius: 6px; border: 1px dashed #ccc;">
                            <span style="color:var(--taitung-blue); font-weight:bold;">末五碼/備註：</span> ${reg.proofText || "未填寫"}
                            <br>${displayImg}
                        </div>
                        <button class="btn btn-outline" style="border-color:var(--vintage-green); color:var(--vintage-green); margin-top:15px;" 
                                onclick="approvePayment('${reg.id}')">✓ 批准確認付款</button>
                    </div>
                `;
            });
        }

        html += `<hr style="margin:25px 0; border:none; border-top:1px dashed #ccc;">`;

        // 3. 已批准有效名單
        html += `<h4 style="color:var(--vintage-green);">✅ 已批准有效名單 (${approvedList.length})</h4>`;
        if(approvedList.length === 0) {
            html += "<p style='color:#888;'>尚無已核准的名單。</p>";
        } else {
            approvedList.forEach(reg => {
                let orderBadge = reg.orderNo ? `<span class="order-badge">訂單：${reg.orderNo}</span>` : `<span class="order-badge">編號：${reg.id}</span>`;
                html += `
                    <div class="card" style="border-left: 5px solid var(--vintage-green);">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <div style="margin-bottom:4px;">${orderBadge}</div>
                                <strong style="color:var(--taitung-blue); font-size:18px;">${reg.shopName} (${reg.phone})</strong><br>
                                <span style="color:#555; font-size:14px;">名額：${reg.pax}</span><br>
                                <span style="color:var(--vintage-green); font-size:14px; font-weight:bold;">實收：NT$ ${reg.amt}</span>
                            </div>
                            <span class="status-badge bg-success">已通過</span>
                        </div>
                        <div style="margin-top:10px; text-align:right;">
                            <button class="btn btn-danger btn-sm" onclick="adminInitiateRefund('${reg.id}', ${reg.amt})">協助取消並發起退款</button>
                        </div>
                    </div>
                `;
            });
        }

        // 4. 已完成退款作廢名單
        if (refundedList.length > 0) {
            html += `<hr style="margin:25px 0; border:none; border-top:1px dashed #ccc;">`;
            html += `<h4 style="color:#7f8c8d;">📁 已完成退款紀錄 (${refundedList.length})</h4>`;
            refundedList.forEach(reg => {
                let orderBadge = reg.orderNo ? `<span class="order-badge">訂單：${reg.orderNo}</span>` : `<span class="order-badge">編號：${reg.id}</span>`;
                html += `
                    <div class="card" style="border-left: 5px solid #7f8c8d; opacity:0.8;">
                        <div style="margin-bottom:4px;">${orderBadge} <span class="status-badge bg-refunded">已退款</span></div>
                        <strong>${reg.shopName} (${reg.phone})</strong> - 已全額退回 NT$ ${reg.amt}<br>
                        <span style="font-size:12px; color:#888;">原路帳戶：${reg.refundBankCode} - ${reg.refundAccount} (${reg.refundName})</span>
                    </div>
                `;
            });
        }

        container.innerHTML = html;
    }

    async function approvePayment(regId) {
        if(confirm("確認款項無誤並批准付款嗎？")) {
            showLoading(true);
            try {
                await db.collection("registrations").doc(regId).update({
                    status: "approved",
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("已批准！該會員裝置已即時跳轉為電子邀請函。");
            } catch (error) {
                alert("核准失敗：" + error.message);
            }
            showLoading(false);
        }
    }

    // 管理員端主動發起退款
    async function adminInitiateRefund(regId, amt) {
        const bankCode = prompt(`【管理員協助發起退款】\n退款金額：NT$ ${amt}\n\n請輸入會員的【匯款銀行代號】：`);
        if (!bankCode) return;
        const account = prompt("請輸入會員的【匯款帳號】：");
        if (!account) return;
        const name = prompt("請輸入會員的【戶名】：");
        if (!name) return;

        showLoading(true);
        try {
            await db.collection("registrations").doc(regId).update({
                status: "refunding",
                refundBankCode: bankCode.trim(),
                refundAccount: account.trim(),
                refundName: name.trim(),
                refundInitiatedByAdmin: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("已將此訂單轉入「待退款名單」！");
        } catch (error) {
            alert("操作失敗：" + error.message);
        }
        showLoading(false);
    }

    // 管理員確認完成退款核銷
    async function confirmRefundComplete(regId) {
        if(confirm("確認已經透過網銀將 100% 款項原路退回給會員了嗎？\n\n核銷後電子票券將永久作廢。")) {
            showLoading(true);
            try {
                await db.collection("registrations").doc(regId).update({
                    status: "refunded",
                    refundCompletedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("退款核銷成功！已同步至會員端。");
            } catch (error) {
                alert("核銷失敗：" + error.message);
            }
            showLoading(false);
        }
    }

    function renderAdminMemberList() {
        const container = document.getElementById('member-list-container');
        container.innerHTML = "";
        if(!adminMembersData || adminMembersData.length === 0) {
            container.innerHTML = "<p>目前尚無會員註冊名單。</p>";
            return;
        }
        adminMembersData.forEach(mem => {
            container.innerHTML += `
                <div class="card" style="display:flex; justify-content: space-between; align-items: center;">
                    <div><strong style="color:var(--taitung-blue); font-size:18px;">${mem.shopName}</strong><br>
                    <span style="color:#666; font-size:14px;">📞 ${mem.phone}</span></div>
                </div>`;
        });
    }
</script>
</body>
</html>
