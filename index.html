<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東開店人生 - 聚會報名系統</title>
    <style>
        :root {
            --taitung-blue: #005CAF; 
            --vintage-green: #2b5f3a; 
            --danger-red: #d9534f;
            --bg-light: #f5f5f5;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', '微軟正黑體', sans-serif;
            background: repeating-linear-gradient(45deg, #ffffff, #ffffff 15px, #eef5f0 15px, #eef5f0 30px);
            margin: 0; padding: 15px; color: #333;
            display: flex; justify-content: center;
        }

        .app-container {
            width: 100%; max-width: 600px; background: white;
            border: 2px solid var(--vintage-green); border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); overflow: hidden;
            min-height: 85vh; position: relative;
        }

        .header {
            background-color: var(--vintage-green); color: white;
            padding: 15px; text-align: center; font-size: 20px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .header-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            padding: 5px 10px; border-radius: 5px; cursor: pointer;
        }

        .nav-tabs { display: flex; background: #eee; border-bottom: 2px solid var(--vintage-green); }
        .nav-tabs button {
            flex: 1; padding: 12px; border: none; background: none;
            font-size: 15px; font-weight: bold; cursor: pointer; color: #666;
        }
        .nav-tabs button.active { background: white; color: var(--taitung-blue); border-bottom: 4px solid var(--taitung-blue); }

        .content { padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--vintage-green); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .form-group textarea { resize: vertical; }

        .btn {
            display: block; width: 100%; padding: 12px;
            background-color: var(--taitung-blue); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px; text-align: center; box-sizing: border-box;
        }
        .btn-outline { background: white; color: var(--vintage-green); border: 2px solid var(--vintage-green); }
        .btn-danger { background: var(--danger-red); }
        
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #fafafa; }
        .card h3 { margin: 0 0 10px 0; color: var(--taitung-blue); font-size: 22px; }
        .card p { margin: 5px 0; line-height: 1.5; }
        .summary-box { background: #eef5f0; padding: 15px; border-radius: 8px; border-left: 5px solid var(--taitung-blue); margin-bottom: 15px; }
        
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .bg-pending { background: #f0ad4e; }
        .bg-unpaid { background: var(--danger-red); }
        .bg-success { background: var(--vintage-green); }

        .ticket { border: 3px dashed var(--vintage-green); padding: 20px; text-align: center; background: white; margin-bottom: 20px; position: relative; }
        .ticket-name { color: var(--taitung-blue); font-size: 28px; font-weight: bold; margin: 10px 0; }
        .ticket-stamp { margin-top: 15px; display: inline-block; border: 3px solid #d9534f; color: #d9534f; padding: 8px 16px; font-size: 20px; font-weight: bold; transform: rotate(-5deg); border-radius: 8px; }
        
        .proof-img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ccc; }
        .poster-preview { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; display: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .countdown-text { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        
        .timeline { display: flex; justify-content: space-between; position: relative; margin: 20px 0; text-align: center; font-size: 13px; font-weight: bold; color: #ccc; }
        .timeline::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #ddd; z-index: 1; }
        .timeline-step { position: relative; z-index: 2; flex: 1; }
        .timeline-icon { width: 26px; height: 26px; border-radius: 50%; background: #ddd; margin: 0 auto 5px; line-height: 26px; color: white; font-size: 14px; }
        .timeline-step.active .timeline-icon { background: var(--taitung-blue); box-shadow: 0 0 0 3px rgba(0,92,175,0.2); }
        .timeline-step.active { color: var(--taitung-blue); }
        .timeline-step.done .timeline-icon { background: var(--vintage-green); }
        .timeline-step.done { color: var(--vintage-green); }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            font-size: 22px; font-weight: bold; color: var(--taitung-blue);
        }
    </style>
</head>
<body>

<div id="loading-overlay">雲端連線中，請稍候...</div>

<div class="app-container">
    <div class="header">
        <span id="header-title">系統登入</span>
        <button id="logout-btn" class="header-btn" style="display:none;" onclick="logout()">登出</button>
    </div>

    <!-- ================= 登入網關 ================= -->
    <div id="sys-gateway" class="view active">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('sys-gateway', 'login-member', this)">會員登入</button>
            <button class="tab-btn" onclick="switchTab('sys-gateway', 'login-admin', this)">管理員登入</button>
        </div>
        <div class="content">
            <div id="login-member" class="sub-view active">
                <div class="form-group"><label>手機號碼 (必填)</label><input type="tel" id="member-phone" placeholder="請輸入手機號碼"></div>
                <div class="form-group"><label>邀請碼 (首次登入必填)</label><input type="text" id="member-code" placeholder="舊會員可留空"></div>
                <button class="btn" onclick="handleMemberLogin()">連線登入系統</button>
            </div>
            
            <div id="login-admin" class="sub-view" style="display:none;">
                <div class="form-group"><label>管理員帳號</label><input type="text" id="admin-user" placeholder="預設: 1234567"></div>
                <div class="form-group"><label>密碼</label><input type="password" id="admin-pwd" placeholder="預設: 7654321"></div>
                <button class="btn btn-danger" onclick="handleAdminLogin()">登入後台</button>
            </div>
        </div>
    </div>

    <!-- ================= 一般會員前台 ================= -->
    <div id="sys-member" class="view">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('sys-member', 'mem-events', this); renderEventInfo();">活動報名</button>
            <button class="tab-btn" onclick="switchTab('sys-member', 'mem-myrecords', this); renderMyRecord();">我的報名</button>
        </div>
        <div class="content">
            <!-- 活動列表 -->
            <div id="mem-events" class="sub-view active">
                <div class="card" style="padding-top: 10px;">
                    <img id="display-event-poster" class="poster-preview" src="">
                    <h3 id="display-event-title">載入中...</h3>
                    <div class="summary-box" style="margin-top: 15px; border-left-color: var(--danger-red);">
                        <p style="margin: 0; font-weight: bold; color: var(--danger-red);">⏳ 報名截止倒數：</p>
                        <div id="countdown-deadline" class="countdown-text" style="color:var(--danger-red);">計算中...</div>
                    </div>
                    <div class="summary-box" style="margin-top: 15px; border-left-color: var(--vintage-green);">
                        <p style="margin: 0; font-weight: bold; color: var(--vintage-green);">🎊 距離活動開始還有：</p>
                        <div id="countdown-event" class="countdown-text" style="color:var(--vintage-green);">計算中...</div>
                    </div>
                    <p id="display-event-datetime" style="font-weight:bold; color:var(--vintage-green);">📅 活動時間：</p>
                    <p id="display-event-deadline-text" style="color:var(--danger-red); font-weight:bold;">⏳ 報名截止：</p>
                    <p id="display-event-location">📍 地點：</p>
                    <p id="display-event-desc" style="white-space: pre-wrap; color: #555; background: #fff; padding: 10px; border-radius: 6px; border: 1px dashed #ccc;"></p>
                    <div class="summary-box" style="margin-top: 15px;">
                        <p id="display-event-price" style="font-size: 16px; margin:0; text-align:center;"></p>
                    </div>
                    <button id="btn-show-form" class="btn" onclick="document.getElementById('mem-form-area').style.display='block'">我要填寫報名表</button>
                </div>
                
                <!-- 報名表單 -->
                <div id="mem-form-area" style="display:none; border-top: 2px dashed #ccc; margin-top: 20px; padding-top: 20px;">
                    <div class="form-group"><label id="label-adult-price">大人</label><input type="number" id="qty-adult" value="0" min="0" oninput="calcTotal()"></div>
                    <div class="form-group"><label id="label-child-price">小孩</label><input type="number" id="qty-child" value="0" min="0" oninput="calcTotal()"></div>
                    <div class="form-group"><label id="label-toddler-price" style="color:var(--danger-red);">6歲以下 (免費)</label><input type="number" id="qty-toddler" value="0" min="0" oninput="calcTotal()"></div>
                    <div class="summary-box">總費用：NT$ <strong id="calc-total-amt" style="font-size:20px; color:var(--taitung-blue)">0</strong></div>
                    <button class="btn" onclick="submitRegistration()">送出並寫入雲端</button>
                </div>
            </div>

            <!-- 我的報名 -->
            <div id="mem-myrecords" class="sub-view" style="display:none;">
                <button class="btn btn-outline" style="margin-bottom:15px;" onclick="refreshMyData()">🔄 重新整理最新進度</button>
                <div id="my-record-container"></div>
            </div>
        </div>
    </div>

    <!-- ================= 管理員後台 ================= -->
    <div id="sys-admin" class="view">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('sys-admin', 'admin-event', this)">發佈活動</button>
            <button class="tab-btn" onclick="switchTab('sys-admin', 'admin-approve', this); renderAdminApprovals();">名單審核</button>
            <button class="tab-btn" onclick="switchTab('sys-admin', 'admin-members', this); renderAdminMemberList();">會員管理</button>
        </div>
        <div class="content">
            <div id="admin-event" class="sub-view active">
                <div class="summary-box" style="font-size: 14px;">填寫完畢點擊最下方按鈕，即可同步更新至所有會員的手機中。</div>
                <div class="form-group">
                    <label>上傳活動海報圖片</label>
                    <input type="file" id="set-evt-poster" accept="image/*" onchange="previewAdminPoster(this)">
                    <img id="admin-poster-preview" class="proof-img-preview" style="max-height:150px;">
                </div>
                <div class="form-group"><label>活動名稱</label><input type="text" id="set-evt-title"></div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;"><label>活動舉辦時間</label><input type="datetime-local" id="set-evt-datetime"></div>
                    <div class="form-group" style="flex:1;"><label>報名截止時間</label><input type="datetime-local" id="set-evt-deadline"></div>
                </div>
                <div class="form-group"><label>活動地點</label><input type="text" id="set-evt-location"></div>
                <div class="form-group"><label>補充文字欄 (活動細節與說明)</label><textarea id="set-evt-desc" rows="4"></textarea></div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group"><label>大人費用</label><input type="number" id="set-evt-adult"></div>
                    <div class="form-group"><label>小孩費用</label><input type="number" id="set-evt-child"></div>
                </div>
                <div class="form-group"><label>收款銀行與帳號</label><input type="text" id="set-evt-bank"></div>
                <button class="btn" onclick="publishEvent()">發佈並同步活動圖文</button>
            </div>

            <div id="admin-approve" class="sub-view" style="display:none;">
                <button class="btn btn-outline" style="margin-bottom:15px;" onclick="refreshAdminData()">🔄 抓取最新雲端名單</button>
                <div id="admin-approval-list"></div>
            </div>

            <div id="admin-members" class="sub-view" style="display:none;">
                <div id="member-list-container"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // 專屬 API 網址 (已串接您的 Google 試算表)
    const API_URL = "https://script.google.com/macros/s/AKfycbwEJIiIsZf1mCrBPi-Odzn2A2USgSeIsA9nD_SHvoZ97RE5j8egQf1ItUTJSgqKF46jng/exec";

    // 全域變數
    let globalPhone = "";
    let globalShopName = "";
    let globalEvent = {};
    let globalHistory = [];
    let adminPending = [];
    let adminMembers = [];
    let countdownTimer = null;

    // 核心 API 呼叫模組
    async function apiCall(action, payload = {}) {
        document.getElementById('loading-overlay').style.display = 'flex';
        payload.action = action;
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            document.getElementById('loading-overlay').style.display = 'none';
            if (data.error) throw new Error(data.error);
            return data;
        } catch (e) {
            document.getElementById('loading-overlay').style.display = 'none';
            alert("網路連線錯誤，請確認網路狀態或稍後再試！");
            console.error(e);
            return null;
        }
    }

    // 圖片壓縮演算法
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 500;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height = height * (MAX_WIDTH / width);
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.5));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function formatTimeDisplay(isoString) {
        if(!isoString) return "未設定";
        return isoString.replace("T", " ");
    }
    function getCurrentTimeStr() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // ==========================================
    // 視圖與登入邏輯
    // ==========================================
    function switchMainView(viewId, title) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('header-title').innerText = title;
        document.getElementById('logout-btn').style.display = 'block';
    }

    function switchTab(parentId, targetId, btnEl) {
        document.querySelectorAll(`#${parentId} .sub-view`).forEach(el => el.style.display = 'none');
        document.querySelectorAll(`#${parentId} .tab-btn`).forEach(el => el.classList.remove('active'));
        document.getElementById(targetId).style.display = 'block';
        btnEl.classList.add('active');
    }

    function logout() { 
        if(countdownTimer) clearInterval(countdownTimer);
        globalPhone = ""; location.reload(); 
    }

    async function handleMemberLogin() {
        const phone = document.getElementById('member-phone').value;
        const code = document.getElementById('member-code').value;
        if(!phone) return alert("請輸入手機號碼！");

        let shopName = "";
        if(code) {
            shopName = prompt("請輸入您的「商家名稱」以完成綁定：") || "";
        }

        const res = await apiCall("member_login", { phone, code, shopName });
        if(res && res.status === "success") {
            globalPhone = phone;
            globalShopName = res.shopName || shopName;
            globalEvent = res.event;
            globalHistory = res.history;
            switchMainView('sys-member', '前台 - ' + globalShopName);
            renderEventInfo();
        }
    }

    async function handleAdminLogin() {
        const user = document.getElementById('admin-user').value;
        const pwd = document.getElementById('admin-pwd').value;
        const res = await apiCall("admin_login", { user, pwd });
        
        if(res && res.status === "success") {
            globalEvent = res.event;
            adminPending = res.pending;
            adminMembers = res.members;
            switchMainView('sys-admin', '管理員專區');
            
            document.getElementById('set-evt-title').value = globalEvent.title || "";
            document.getElementById('set-evt-datetime').value = globalEvent.eventDateTime || "";
            document.getElementById('set-evt-deadline').value = globalEvent.deadline || "";
            document.getElementById('set-evt-location').value = globalEvent.location || "";
            document.getElementById('set-evt-desc').value = globalEvent.desc || "";
            document.getElementById('set-evt-adult').value = globalEvent.adultPrice || 0;
            document.getElementById('set-evt-child').value = globalEvent.childPrice || 0;
            document.getElementById('set-evt-bank').value = globalEvent.bank || "";
            if(globalEvent.posterImg) {
                document.getElementById('admin-poster-preview').src = globalEvent.posterImg;
                document.getElementById('admin-poster-preview').style.display = 'block';
            }
        } else {
            alert("❌ 帳號或密碼錯誤！");
        }
    }

    // ==========================================
    // 會員前台邏輯
    // ==========================================
    function startCountdowns() {
        if(countdownTimer) clearInterval(countdownTimer);
        function update() {
            const now = new Date().getTime();
            if(globalEvent.deadline) {
                const dlTime = new Date(globalEvent.deadline).getTime();
                const diffDl = dlTime - now;
                if(diffDl > 0) {
                    const d = Math.floor(diffDl / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diffDl % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diffDl % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diffDl % (1000 * 60)) / 1000);
                    document.getElementById('countdown-deadline').innerText = `${d}天 ${h}時 ${m}分 ${s}秒`;
                    document.getElementById('btn-show-form').style.display = 'block';
                } else {
                    document.getElementById('countdown-deadline').innerText = "已截止";
                    document.getElementById('btn-show-form').style.display = 'none';
                    document.getElementById('mem-form-area').style.display = 'none';
                }
            }
            if(globalEvent.eventDateTime) {
                const evtTime = new Date(globalEvent.eventDateTime).getTime();
                const diffEvt = evtTime - now;
                if(diffEvt > 0) {
                    const d = Math.floor(diffEvt / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diffEvt % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diffEvt % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diffEvt % (1000 * 60)) / 1000);
                    document.getElementById('countdown-event').innerText = `${d}天 ${h}時 ${m}分 ${s}秒`;
                } else {
                    document.getElementById('countdown-event').innerText = "活動已開始或已結束";
                }
            }
        }
        update();
        countdownTimer = setInterval(update, 1000);
    }

    function renderEventInfo() {
        const posterEl = document.getElementById('display-event-poster');
        if(globalEvent.posterImg) {
            posterEl.src = globalEvent.posterImg;
            posterEl.style.display = 'block';
        }
        document.getElementById('display-event-title').innerText = globalEvent.title;
        document.getElementById('display-event-datetime').innerText = "📅 活動時間：" + formatTimeDisplay(globalEvent.eventDateTime);
        document.getElementById('display-event-deadline-text').innerText = "⏳ 報名截止：" + formatTimeDisplay(globalEvent.deadline);
        document.getElementById('display-event-location').innerText = "📍 地點：" + globalEvent.location;
        document.getElementById('display-event-desc').innerText = globalEvent.desc;
        document.getElementById('display-event-price').innerHTML = `大人 $${globalEvent.adultPrice} | 小孩 $${globalEvent.childPrice} | <strong style="color:var(--danger-red);">6歲以下 免費</strong>`;
        document.getElementById('label-adult-price').innerText = `大人 ($${globalEvent.adultPrice})`;
        document.getElementById('label-child-price').innerText = `小孩 ($${globalEvent.childPrice})`;
        startCountdowns();
    }

    function calcTotal() {
        const a = parseInt(document.getElementById('qty-adult').value) || 0;
        const c = parseInt(document.getElementById('qty-child').value) || 0;
        const total = (a * globalEvent.adultPrice) + (c * globalEvent.childPrice);
        document.getElementById('calc-total-amt').innerText = total;
        return { total, pax: `大人${a}, 小孩${c}, 幼童${document.getElementById('qty-toddler').value||0}` };
    }

    async function submitRegistration() {
        const data = calcTotal();
        if(data.total === 0 && parseInt(document.getElementById('qty-adult').value) === 0) return alert("請至少選擇一位參加者！");
        
        const regId = Date.now().toString() + Math.floor(Math.random() * 1000);
        const payload = {
            id: regId, phone: globalPhone, eventTitle: globalEvent.title,
            regTime: getCurrentTimeStr(), pax: data.pax, amt: data.total
        };
        
        const res = await apiCall("submit_reg", payload);
        if(res && res.status === "success") {
            alert("報名已成功寫入 Google 試算表！請前往「我的報名」查看繳費資訊。");
            document.getElementById('mem-form-area').style.display = 'none';
            await refreshMyData();
            switchTab('sys-member', 'mem-myrecords', document.querySelectorAll('#sys-member .tab-btn')[1]);
        }
    }

    async function refreshMyData() {
        const res = await apiCall("member_login", { phone: globalPhone });
        if(res && res.status === "success") {
            globalHistory = res.history;
            renderMyRecord();
        }
    }

    function getTimelineHTML(status) {
        const isApproved = (status === 'approved');
        return `
        <div class="timeline">
            <div class="timeline-step ${status === 'unpaid' ? 'active' : 'done'}"><div class="timeline-icon">1</div><div>已報名付費中</div></div>
            <div class="timeline-step ${status === 'pending' ? 'active' : (isApproved ? 'done' : '')}"><div class="timeline-icon">2</div><div>審核中</div></div>
            <div class="timeline-step ${isApproved ? 'active' : ''}"><div class="timeline-icon">3</div><div>已成功報名</div></div>
        </div>`;
    }

    function renderMyRecord() {
        const container = document.getElementById('my-record-container');
        if(globalHistory.length === 0) { 
            container.innerHTML = "<p>目前無任何報名紀錄。</p>"; 
            return; 
        }
        container.innerHTML = ""; 
        globalHistory.forEach(myData => {
            let htmlStr = "";
            let timelineHtml = getTimelineHTML(myData.status);
            
            if(myData.status === 'unpaid') {
                htmlStr = `
                    <div class="card">
                        <h3>${myData.eventTitle}</h3>${timelineHtml}
                        <p style="color:#666; font-size:14px;">報名時間：${formatTimeDisplay(myData.regTime)}</p>
                        <p>報名人數：${myData.pax}</p><p>應繳金額：NT$ ${myData.amt}</p>
                        <div class="summary-box" style="margin-top:15px;">
                            <p><strong>匯款帳號：</strong><br>${globalEvent.bank}</p>
                            <div class="form-group" style="margin-top:10px;">
                                <label>📸 上傳明細圖片</label>
                                <input type="file" id="upload-file-${myData.id}" accept="image/*" onchange="previewUserImage(this, '${myData.id}')">
                                <img id="img-preview-${myData.id}" class="proof-img-preview">
                            </div>
                            <div class="form-group"><label>✍️ 或輸入帳號末五碼</label><input type="text" id="upload-text-${myData.id}"></div>
                            <button class="btn btn-outline" onclick="submitProof('${myData.id}')">送出明細至雲端</button>
                        </div>
                    </div>`;
            } else if(myData.status === 'pending') {
                let imgHtml = myData.proofImg ? `<img src="${myData.proofImg}" style="max-width:100%; border-radius:8px; margin-top:10px;">` : "";
                htmlStr = `
                    <div class="card">
                        <h3>${myData.eventTitle}</h3>${timelineHtml}
                        <p style="color:#666; font-size:14px;">報名時間：${formatTimeDisplay(myData.regTime)}</p>
                        <p>報名人數：${myData.pax}</p><p>應繳金額：NT$ ${myData.amt}</p>
                        <p>文字備註：${myData.proofText || "無"}</p>${imgHtml}
                    </div>`;
            } else if(myData.status === 'approved') {
                htmlStr = `
                    <div class="ticket">
                        <div style="color:#666; font-size:12px; position:absolute; top:10px; right:10px;">${formatTimeDisplay(myData.regTime)}</div>
                        <div>憑此畫面入場</div>
                        <div class="ticket-name">${globalShopName}</div>
                        <div>${myData.eventTitle}</div>${timelineHtml}
                        <div style="margin-top:10px; color:var(--vintage-green); font-weight:bold;">活動時間：${formatTimeDisplay(globalEvent.eventDateTime)}</div>
                        <div style="margin-top:10px;">總入場人數：<br><strong>${myData.pax}</strong></div>
                        <div class="ticket-stamp">已付費報名成功</div>
                    </div>`;
            }
            container.innerHTML += htmlStr;
        });
    }

    function previewUserImage(input, regId) {
        if (input.files && input.files[0]) {
            compressImage(input.files[0], function(base64Str) {
                document.getElementById('img-preview-' + regId).src = base64Str;
                document.getElementById('img-preview-' + regId).style.display = 'block';
            });
        }
    }

    async function submitProof(regId) {
        const textProof = document.getElementById('upload-text-' + regId).value;
        const imgEl = document.getElementById('img-preview-' + regId);
        let imgBase64 = imgEl.style.display === 'block' ? imgEl.src : "";
        
        if(!textProof && !imgBase64) return alert("請至少上傳一張圖片或輸入末五碼！");

        const res = await apiCall("upload_proof", { id: regId, proofText: textProof, proofImg: imgBase64 });
        if(res && res.status === "success") {
            alert("明細已送出！已同步至雲端供管理員核對。");
            await refreshMyData();
        }
    }

    // ==========================================
    // 管理員邏輯
    // ==========================================
    function previewAdminPoster(input) {
        if (input.files && input.files[0]) {
            compressImage(input.files[0], function(base64Str) {
                document.getElementById('admin-poster-preview').src = base64Str;
                document.getElementById('admin-poster-preview').style.display = 'block';
            });
        }
    }

    async function publishEvent() {
        const title = document.getElementById('set-evt-title').value;
        if(!title) return alert("請輸入活動名稱！");
        
        const imgEl = document.getElementById('admin-poster-preview');
        const payload = {
            title,
            eventDateTime: document.getElementById('set-evt-datetime').value,
            deadline: document.getElementById('set-evt-deadline').value,
            location: document.getElementById('set-evt-location').value,
            desc: document.getElementById('set-evt-desc').value,
            adultPrice: document.getElementById('set-evt-adult').value,
            childPrice: document.getElementById('set-evt-child').value,
            bank: document.getElementById('set-evt-bank').value,
            posterImg: imgEl.style.display === 'block' ? imgEl.src : ""
        };

        const res = await apiCall("admin_publish", payload);
        if(res && res.status === "success") {
            alert("發佈成功！海報與圖文皆已寫入雲端。");
        }
    }

    async function refreshAdminData() {
        const user = document.getElementById('admin-user').value;
        const pwd = document.getElementById('admin-pwd').value;
        const res = await apiCall("admin_login", { user, pwd });
        if(res && res.status === "success") {
            adminPending = res.pending;
            adminMembers = res.members;
            renderAdminApprovals();
        }
    }

    function renderAdminApprovals() {
        const container = document.getElementById('admin-approval-list');
        container.innerHTML = "";
        if(adminPending.length === 0) {
            container.innerHTML = "<p>目前雲端沒有待審核的名單。</p>";
            return;
        }
        
        adminPending.forEach(reg => {
            let displayImg = reg.proofImg ? `<img src="${reg.proofImg}" style="max-width:100%; border-radius:8px; margin: 10px 0; border: 1px solid #ccc;">` : "";
            container.innerHTML += `
                <div class="card" style="border-left: 5px solid #f0ad4e;">
                    <h3>${reg.shopName} (${reg.phone})</h3>
                    <p style="color:#666; font-size:14px;">送單時間：${formatTimeDisplay(reg.regTime)}</p>
                    <p>報名活動：${reg.eventTitle}</p>
                    <p>應收：NT$ ${reg.amt}</p>
                    <div style="background: #fff; padding: 10px; border-radius: 6px; border: 1px dashed #ccc;">
                        <span style="color:var(--taitung-blue); font-weight:bold;">末五碼/備註：</span> ${reg.proofText || "未填寫"}
                        <br>${displayImg}
                    </div>
                    <button class="btn btn-outline" style="border-color:var(--vintage-green); color:var(--vintage-green); margin-top:15px;" 
                            onclick="approvePayment('${reg.id}')">✓ 批准確認付款</button>
                </div>
            `;
        });
    }

    async function approvePayment(regId) {
        if(confirm("確認款項無誤並批准付款嗎？")) {
            const res = await apiCall("admin_approve", { id: regId });
            if(res && res.status === "success") {
                alert("已批准！狀態已更新至雲端。");
                await refreshAdminData();
            }
        }
    }

    function renderAdminMemberList() {
        const container = document.getElementById('member-list-container');
        container.innerHTML = "";
        adminMembers.forEach(mem => {
            container.innerHTML += `
                <div class="card" style="display:flex; justify-content: space-between; align-items: center;">
                    <div><strong style="color:var(--taitung-blue); font-size:18px;">${mem.shopName}</strong><br>
                    <span style="color:#666; font-size:14px;">📞 ${mem.phone}</span></div>
                </div>`;
        });
    }
</script>
</body>
</html>
